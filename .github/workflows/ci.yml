name: AI Real Estate Platform CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package.json'
      - name: Install dependencies
        run: |
          cd server
          npm install
          chmod -R +x node_modules/.bin || true
      - name: Run Backend Tests
        run: |
          cd server
          npm test

  ai-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          cd ai-service
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package.json'
      - name: Install dependencies & build frontend
        run: |
          cd client
          npm install
          chmod -R +x node_modules/.bin || true
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-service-tests, frontend-build]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Backend Container
        run: docker build -f docker/Dockerfile.server ./server
      - name: Build AI Container
        run: docker build -f docker/Dockerfile.ai ./ai-service
      - name: Build Frontend Container
        run: docker build -f docker/Dockerfile.client ./client
