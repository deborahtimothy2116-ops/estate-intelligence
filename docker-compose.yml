version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: estate_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: real_estate_db
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: estate_redis
    restart: always
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/Dockerfile.ai
    container_name: estate_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./ai-service:/app

  backend:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: estate_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/real_estate_db
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_real_estate_2026}
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - ai-service

  frontend:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: estate_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
